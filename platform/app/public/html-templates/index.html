<!doctype html>
<html lang="es">
  <head>
    <!--
      Content-Security-Policy is delivered via hosting headers (netlify.toml
      for Netlify deploys; commented add_header examples in the nginx
      recipes under platform/app/.recipes), not as a meta tag: a meta tag
      cannot express Report-Only mode. See the deployment docs
      (docs/deployment) for the policy and the criteria for promoting it
      from Report-Only to enforcing.
    -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="theme-color"
      content="#061423"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="application-name"
      content="Pixos® Viewer"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Pixos® Viewer"
    />
    <meta
      name="msapplication-TileColor"
      content="#fff"
    />
    <meta
      name="msapplication-TileImage"
      content="<%= PUBLIC_URL %>assets/mstile-144x144.png"
    />
    <meta
      name="msapplication-config"
      content="<%= PUBLIC_URL %>assets/browserconfig.xml"
    />
    <script type="text/javascript">
      console.time('scriptToView');
      window.PUBLIC_URL = '<%= PUBLIC_URL %>';
    </script>
    <link
      rel="manifest"
      href="<%= PUBLIC_URL %>manifest.json"
    />

    <link
      rel="shortcut icon"
      href="<%= PUBLIC_URL %>favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= PUBLIC_URL %>favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= PUBLIC_URL %>favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      href="<%= PUBLIC_URL %>apple-touch-icon.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 1)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-320x460.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-640x920.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-640x1096.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-750x1294.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 736px) and (orientation: landscape) and (-webkit-device-pixel-ratio: 3)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-1182x2208.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 736px) and (orientation: portrait) and (-webkit-device-pixel-ratio: 3)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-1242x2148.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 768px) and (device-height: 1024px) and (orientation: landscape) and (-webkit-device-pixel-ratio: 1)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-748x1024.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 768px) and (device-height: 1024px) and (orientation: portrait) and (-webkit-device-pixel-ratio: 1)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-768x1004.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 768px) and (device-height: 1024px) and (orientation: landscape) and (-webkit-device-pixel-ratio: 2)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-1496x2048.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 768px) and (device-height: 1024px) and (orientation: portrait) and (-webkit-device-pixel-ratio: 2)"
      href="<%= PUBLIC_URL %>assets/apple-touch-startup-image-1536x2008.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="228x228"
      href="<%= PUBLIC_URL %>assets/coast-228x228.png"
    />
    <link
      rel="yandex-tableau-widget"
      href="<%= PUBLIC_URL %>assets/yandex-browser-manifest.json"
    />

    <script
      rel="preload"
      as="script"
      type="text/javascript"
      src="<%= PUBLIC_URL %>app-config.js"
    ></script>
    <script
      rel="preload"
      as="script"
      type="module"
      src="<%= PUBLIC_URL %>init-service-worker.js"
    ></script>

    <title>pixOS Imagen · Visor</title>

    <script>
      function browserImportFunction(moduleId) {
        return import(moduleId);
      }

      window.PUBLIC_URL = '<%= PUBLIC_URL %>';
    </script>

    <!-- EXTENSIONS -->
    <!-- <script type="text/javascript" src="path/to/some-extension.js"></script>

    <script>
      // If configuration file is a JS Object:
      window.config.extensions = [SomeExtension];

      // If configuration file is a JS Function:
      window.config = () => {
        return {
          extensions: [SomeExtension]
        };
      };
    </script> -->
  </head>

  <body>
    <noscript>Para ver las imágenes active JavaScript en su navegador.</noscript>
    <div id="react-portal"></div>
    <div id="root">
      <!-- pixOS: visible until React renders (replaced on mount) -->
      <style>
        html,body{margin:0;background:#061423}
        .px-boot{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;background:radial-gradient(110% 80% at 80% 0%,#0b2a45 0%,#061423 60%);color:#8199b2;font:500 13px/1.4 Figtree,Inter,system-ui,sans-serif}
        .px-boot svg{width:66px;height:61px}
        .px-boot .r{stroke:#ff8d47;opacity:.6;stroke-dasharray:130 486;transform-origin:92.4px 81.5px;animation:pxo 2.4s cubic-bezier(.45,.05,.25,1) infinite}
        .px-boot .b{fill:#84aacb}
        .px-boot .f{fill:#ff7a2f;transform-box:fill-box;transform-origin:0 0;animation:pxh 2.4s cubic-bezier(.2,.8,.2,1) infinite}
        @keyframes pxo{to{transform:rotate(360deg)}}
        @keyframes pxh{50%{transform:translate(4px,4px)}}
        @media (prefers-reduced-motion:reduce){.px-boot .r,.px-boot .f{animation:none}}
      </style>
      <div class="px-boot" role="status" aria-live="polite">
        <svg viewBox="-20 -20 225 203" aria-hidden="true">
          <circle class="r" cx="92.4" cy="81.5" r="98" fill="none" stroke-width="3" stroke-linecap="round" />
          <g transform="matrix(0.707107 -0.707107 -0.707107 -0.707107 92.426 163.137)">
            <path class="b" d="M7,0 L110,0 A50,50 0 0 1 110,100 L100,100 L100,110 A50,50 0 0 1 0,110 L0,7 Q0,0 7,0 Z" />
            <path class="f" d="M30,0 L110,0 A50,50 0 0 1 110,100 L58,100 Q30,100 30,72 Z" />
          </g>
        </svg>
        <span>Abriendo el visor…</span>
      </div>
    </div>
  </body>
</html>
