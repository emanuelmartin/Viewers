              - paragraph [ref=e522]:
                - strong [ref=e523]: RESONANCIA MAGNETICA DE COLUMNA LUMBAR
              - paragraph [ref=e524]: "Se realiza estudio de región mencionada, con equipo siemens de 3 Teslas, enfatizada en ponderaciones T1, T2 Y STIR, en fase simple, con adquisiciones transversales, sagitales y coronales, observando lo siguiente:"
              - paragraph [ref=e525]
              - paragraph [ref=e526]:
                - strong [ref=e527]: "Tejidos blandos:"
                - text: sin señales de sospecha. Atrofia grasa grado II de músculos erectores, con edema leve asociado.
              - paragraph [ref=e528]:
                - strong [ref=e529]: "Estructuras ligamentarias:"
                - text: ligamento longitudinal anterior y posterior de configuración habitual, con espesor normal. Ligamento amarillo muestra engrosamiento a nivel de L4 y L5 principalmente. Edema tenue en ligamentos interespinosos.
              - paragraph [ref=e530]:
                - strong [ref=e531]: "Estructuras óseas:"
                - text: morfología conservada de los somas. Sin defectos de fusión o segmentación aparentes. Medula ósea con patrón en general adecuados. Sin fracturas. Cambios de aspecto degenerativo en plataformas con esclerosis leve, algunas esquinas anteriores somáticas con depósitos grasos, y osteítis leve en algunas excrecencias. Cambios Modic I parciales leves a nivel izquierdo de unión discovertebral de L5-S1. Sin erosiones sospechosas. Artropatía facetaria importante con hipertrofia de facetas, irregularidad, disminución de espacios, sinovitis, con algunos quistes parafacetarios externos de predominio en L4-L5 y L5-S1.
              - paragraph [ref=e532]:
                - strong [ref=e533]: "Alineación:"
                - text: En plano sagital con ángulo de lordosis de 42 grados; anterolistesis grado I de L4. Tendencia a desplazamiento laterales sin curvatura patológica.
              - paragraph [ref=e534]: Sacro con tendencia a horizontalizacion, con ángulo de inclinación sacra de 48 grados.
              - paragraph [ref=e535]:
                - strong [ref=e536]: "Discos intervertebrales:"
                - text: "con disminución de señal del núcleo pulposo difuso, conservando altura, que traduce cambios entre grado 4/8 en escala de Pfirmman modificado. Hernias a continuación descritas:"
              - paragraph [ref=e537]: Discos de L1-L2, L2-L3 y L3-4 con abombamiento anular posterior leve.
              - paragraph [ref=e538]: Disco de L4-L5 con pseudoprotrusion posterior de base ancha leve.
              - paragraph [ref=e539]: Disco de L5-S1 con protrusion posterior de base ancha, con longitud AP de 6.5 mm.
              - paragraph [ref=e540]:
                - strong [ref=e541]: "Canal vertebral:"
                - text: disminución de diámetros de grado moderado a severa en L4-L5 y L5-S1 con aglomeración de raíces; en L3-L4 con disminución de diámetros de grado leve a moderado.
                - strong [ref=e542]
                - text: Cono medular termina a nivel de L1; medula espinal y filum sin señales de sospecha. Saco dural termina a nivel de L5-S1. Sin colecciones intrarraquídeas evidentes.
              - paragraph [ref=e543]:
                - strong [ref=e544]: "Recesos laterales:"
                - text: con disminución de amplitud de alto grado a nivel bilateral de L5-S1, en L4-L5 de grado moderado.
              - paragraph [ref=e545]:
                - strong [ref=e546]: "Neuroforamenes:"
                - text: grasa perineural con obliteración moderada en L5-S1. Quiste perineural en foramen derecho de D12-L1 con diámetro mayor de 0.7 cm.
              - paragraph [ref=e547]:
                - strong [ref=e548]: "Hallazgos adicionales:"
                - text: Lo visualizado en abdomen sin señales de sospecha.
              - paragraph [ref=e549]:
                - strong [ref=e550]:
