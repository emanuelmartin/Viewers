              - paragraph [ref=e552]:
                - strong [ref=e553]:
                  - emphasis [ref=e554]: "Conclusión:"
              - paragraph [ref=e555]:
                - strong [ref=e556]:
                  - emphasis [ref=e557]: "Estudios que muestra datos compatibles con:"
              - paragraph [ref=e558]:
                - strong [ref=e559]:
                  - emphasis [ref=e560]: 1. Artropatia facetaria de grado moderado a severo principalmente en L4-L5 y L5-S1.
              - paragraph [ref=e561]:
                - strong [ref=e562]:
                  - emphasis [ref=e563]: 2. Cambios crónicos de menor grado en plataformas somáticas. Discretos cambios Modic a nivel izquierdo de unión discovertebral de L5-S1. Sin erosiones ni signos de proceso inflamatorio sospechoso.
              - paragraph [ref=e564]:
                - strong [ref=e565]:
                  - emphasis [ref=e566]: 3. Engrosamiento de ligamento amarillo de predominio en L4 y L5.
              - paragraph [ref=e567]:
                - strong [ref=e568]:
                  - emphasis [ref=e569]: 4. Anterolistesis grado I de L4. Lordosis lumbar de 42 grados. Angulo de inclinación sacra de 48 grados.
              - paragraph [ref=e570]:
                - strong [ref=e571]:
                  - emphasis [ref=e572]: "5. Cambios crónicos en discos intervertebrales de grado 4/8 en escala de Pfirmman modificado. Hernias a continuación descritas:"
              - paragraph [ref=e573]:
                - strong [ref=e574]:
                  - emphasis [ref=e575]: Discos de L1-L2, L2-L3 y L3-4 con abombamiento anular posterior leve.
              - paragraph [ref=e576]:
                - strong [ref=e577]:
                  - emphasis [ref=e578]: Disco de L4-L5 con pseudoprotrusion posterior de base ancha leve.
              - paragraph [ref=e579]:
                - strong [ref=e580]:
                  - emphasis [ref=e581]: Disco de L5-S1 con protrusion posterior de base ancha, con longitud AP de 6.5 mm.
              - paragraph [ref=e582]:
                - strong [ref=e583]:
                  - emphasis [ref=e584]: 6. Conducto vertebral con estenosis moderada a severa en L4-L5 y L5-S1, de causa multifactorial degenerativa; grado 2-3/3 en escala de Lee.
              - paragraph [ref=e585]:
                - strong [ref=e586]:
                  - emphasis [ref=e587]: 7. Estenosis de recesos laterales de alto grado en L5-S1; grado 3/3 en escala de Bartynski. De grado moderado en recesos de L4-L5.
              - paragraph [ref=e588]:
                - strong [ref=e589]:
                  - emphasis [ref=e590]: 8. Obliteraciones de grasa perineural en forámenes de L5-S1 de grado moderado. Grado 2/3, basado en escala de Zurich-Lee.
              - paragraph [ref=e591]:
                - strong [ref=e592]:
                  - emphasis [ref=e593]: 9. Quiste perineural derecho en D12-L1 de 0.7 cm.
              - paragraph [ref=e594]:
                - strong [ref=e595]:
                  - emphasis [ref=e596]: 10. Atrofia grasa de músculos erectores grado II.
