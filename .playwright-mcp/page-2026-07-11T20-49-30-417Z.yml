                  - emphasis [ref=e579]: "Conclusión:"
              - paragraph [ref=e580]:
                - strong [ref=e581]:
                  - emphasis [ref=e582]: "Estudios que muestra datos compatibles con:"
              - paragraph [ref=e583]:
                - strong [ref=e584]:
                  - emphasis [ref=e585]: 1. Artropatia facetaria de grado moderado a severo principalmente en L4-L5 y L5-S1.
              - paragraph [ref=e586]:
                - strong [ref=e587]:
                  - emphasis [ref=e588]: 2. Cambios crónicos de menor grado en plataformas somáticas. Discretos cambios Modic a nivel izquierdo de unión discovertebral de L5-S1. Sin erosiones ni signos de proceso inflamatorio sospechoso.
              - paragraph [ref=e589]:
                - strong [ref=e590]:
                  - emphasis [ref=e591]: 3. Engrosamiento de ligamento amarillo de predominio en L4 y L5.
              - paragraph [ref=e592]:
                - strong [ref=e593]:
                  - emphasis [ref=e594]: 4. Anterolistesis grado I de L4. Lordosis lumbar de 42 grados. Angulo de inclinación sacra de 48 grados.
              - paragraph [ref=e595]:
                - strong [ref=e596]:
                  - emphasis [ref=e597]: "5. Cambios crónicos en discos intervertebrales de grado 4/8 en escala de Pfirmman modificado. Hernias a continuación descritas:"
              - paragraph [ref=e598]:
                - strong [ref=e599]:
                  - emphasis [ref=e600]: Discos de L1-L2, L2-L3 y L3-4 con abombamiento anular posterior leve.
              - paragraph [ref=e601]:
                - strong [ref=e602]:
                  - emphasis [ref=e603]: Disco de L4-L5 con pseudoprotrusion posterior de base ancha leve.
              - paragraph [ref=e604]:
                - strong [ref=e605]:
                  - emphasis [ref=e606]: Disco de L5-S1 con protrusion posterior de base ancha, con longitud AP de 6.5 mm.
              - paragraph [ref=e607]:
                - strong [ref=e608]:
                  - emphasis [ref=e609]: 6. Conducto vertebral con estenosis moderada a severa en L4-L5 y L5-S1, de causa multifactorial degenerativa; grado 2-3/3 en escala de Lee.
              - paragraph [ref=e610]:
                - strong [ref=e611]:
                  - emphasis [ref=e612]: 7. Estenosis de recesos laterales de alto grado en L5-S1; grado 3/3 en escala de Bartynski. De grado moderado en recesos de L4-L5.
              - paragraph [ref=e613]:
                - strong [ref=e614]:
                  - emphasis [ref=e615]: 8. Obliteraciones de grasa perineural en forámenes de L5-S1 de grado moderado. Grado 2/3, basado en escala de Zurich-Lee.
              - paragraph [ref=e616]:
                - strong [ref=e617]:
                  - emphasis [ref=e618]: 9. Quiste perineural derecho en D12-L1 de 0.7 cm.
              - paragraph [ref=e619]:
