                  - emphasis [ref=e553]: "Estudios que muestra datos compatibles con:"
              - paragraph [ref=e554]:
                - strong [ref=e555]:
                  - emphasis [ref=e556]: 1. Artropatia facetaria de grado moderado a severo principalmente en L4-L5 y L5-S1.
              - paragraph [ref=e557]:
                - strong [ref=e558]:
                  - emphasis [ref=e559]: 2. Cambios crónicos de menor grado en plataformas somáticas. Discretos cambios Modic a nivel izquierdo de unión discovertebral de L5-S1. Sin erosiones ni signos de proceso inflamatorio sospechoso.
              - paragraph [ref=e560]:
                - strong [ref=e561]:
                  - emphasis [ref=e562]: 3. Engrosamiento de ligamento amarillo de predominio en L4 y L5.
              - paragraph [ref=e563]:
                - strong [ref=e564]:
                  - emphasis [ref=e565]: 4. Anterolistesis grado I de L4. Lordosis lumbar de 42 grados. Angulo de inclinación sacra de 48 grados.
              - paragraph [ref=e566]:
                - strong [ref=e567]:
                  - emphasis [ref=e568]: "5. Cambios crónicos en discos intervertebrales de grado 4/8 en escala de Pfirmman modificado. Hernias a continuación descritas:"
              - paragraph [ref=e569]:
                - strong [ref=e570]:
                  - emphasis [ref=e571]: Discos de L1-L2, L2-L3 y L3-4 con abombamiento anular posterior leve.
              - paragraph [ref=e572]:
