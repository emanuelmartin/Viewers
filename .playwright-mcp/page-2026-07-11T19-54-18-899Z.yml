              - paragraph [ref=e575]:
                - strong [ref=e576]:
                  - emphasis [ref=e577]: Disco de L5-S1 con protrusion posterior de base ancha, con longitud AP de 6.5 mm.
              - paragraph [ref=e578]:
                - strong [ref=e579]:
                  - emphasis [ref=e580]: 6. Conducto vertebral con estenosis moderada a severa en L4-L5 y L5-S1, de causa multifactorial degenerativa; grado 2-3/3 en escala de Lee.
              - paragraph [ref=e581]:
                - strong [ref=e582]:
                  - emphasis [ref=e583]: 7. Estenosis de recesos laterales de alto grado en L5-S1; grado 3/3 en escala de Bartynski. De grado moderado en recesos de L4-L5.
              - paragraph [ref=e584]:
                - strong [ref=e585]:
